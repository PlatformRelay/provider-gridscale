name: Coverage

on:
  push:
    branches:
      - main
      - release-*
  pull_request: {}
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  coverage:
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # tokenless Codecov upload (OIDC)
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          # Initializes the `build` submodule required by the make targets.
          submodules: true

      - name: Setup Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          # go.mod pins `toolchain go1.26.5`; with GOTOOLCHAIN=auto this
          # base version transparently fetches the module's toolchain.
          go-version: '1.25'
          check-latest: true

      - name: Run Coverage
        # `make coverage` emits cover.out (scoped to ./config/... + ./internal/clients/...)
        # and then enforces the COVERAGE_MIN floor. cover.out is written before
        # the floor check, so it exists even if the floor trips.
        run: make coverage

      - name: Coverage summary
        if: always()
        run: go tool cover -func=cover.out | tee coverage-summary.txt

      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage
          path: |
            cover.out
            coverage-summary.txt
          if-no-files-found: error

      - name: Upload Coverage to Codecov
        if: always()
        uses: codecov/codecov-action@57e3a136b779b570ffcdbf80b3bdc90e7fab3de2 # v6
        with:
          use_oidc: true # tokenless upload; no CODECOV_TOKEN secret required
          files: cover.out
          flags: unittests
          fail_ci_if_error: false

  # SonarCloud: needs repo secret SONAR_TOKEN. Disable Automatic Analysis on the
  # SonarCloud project first (mutually exclusive with CI-based analysis + Go coverage).
  # Not a protect-main required check — advisory until the quality gate is tuned.
  sonarcloud:
    name: sonarcloud
    runs-on: ubuntu-24.04
    needs: [coverage]
    continue-on-error: true
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - name: Download coverage artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage

      - name: Gate on SONAR_TOKEN
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -z "${SONAR_TOKEN}" ]; then
            echo "has_token=false" >> "${GITHUB_OUTPUT}"
            echo "::warning::SONAR_TOKEN secret is unset; SonarCloud scan skipped. Add the org analysis token under Settings → Secrets → Actions, and disable Automatic Analysis on the SonarCloud project (see sonar-project.properties header)."
          else
            echo "has_token=true" >> "${GITHUB_OUTPUT}"
          fi

      - uses: SonarSource/sonarqube-scan-action@22918119ff8e1ca75a623e15c8296b6ea4fbe28f # v8.2.1
        if: steps.sonar.outputs.has_token == 'true'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

