# SonarCloud CI-based analysis (sonar-scanner / GitHub Action).
# Automatic Analysis cannot import Go coverage — disable it on the project
# (Administration → Analysis Method) before the first CI upload with cover.out.
# Project key matches the existing SonarCloud project used by E5 SECURITY work.

sonar.projectKey=PlatformRelay_provider-gridscale
sonar.organization=platformrelay
sonar.projectName=provider-gridscale

# NOTE: sonar.projectVersion is intentionally NOT set here. It is injected by the
# `sonarcloud` job in .github/workflows/coverage.yml from the latest git tag, so
# it tracks releases without a manual bump. It matters: the quality gate's New
# Code period is `previous_version`, so with no version to anchor on the baseline
# stays pinned at the first-ever analysis and "new code" grows without bound.
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go,**/*_test.py

# Generated code — exclude from ALL analysis (mirrors golangci `generated: lax`
# and the Autoscan-era .sonarcloud.properties exclusions). Test files are sources
# for the test sensor via sonar.test.inclusions, not main sources.
sonar.exclusions=**/zz_*.go,**/*_test.go,**/*_test.py,**/vendor/**

# Hand-written cluster/namespaced mirror — suppress copy-paste only (CPD);
# these files still participate in bug/security/reliability analysis.
sonar.cpd.exclusions=internal/controller/**/*.go,apis/**/*_types.go

# `make coverage` → cover.out, scoped to the hand-authored surface (config,
# internal/clients, the custom non-upjet controllers, and hack/metadatafix).
sonar.go.coverage.reportPaths=cover.out
# Coverage exclusions. `make coverage` produces Go coverage only, so anything
# with no coverage feed (Python helper scripts) or no meaningful branch logic
# (generated API types, main entrypoints, controller wiring) is excluded from the
# coverage metric — it still gets bug/security/reliability analysis.
#   scripts/**          — Python helpers; no Python coverage report is uploaded.
#   **/setup_custom.go  — pure controller registration wiring, no branch logic.
sonar.coverage.exclusions=**/apis/**,**/cmd/**,scripts/**,**/setup_custom.go
