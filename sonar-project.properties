# SonarCloud CI-based analysis (sonar-scanner / GitHub Action).
# Automatic Analysis cannot import Go coverage — disable it on the project
# (Administration → Analysis Method) before the first CI upload with cover.out.
# Project key matches the existing SonarCloud project used by E5 SECURITY work.

sonar.projectKey=PlatformRelay_provider-gridscale
sonar.organization=platformrelay
sonar.projectName=provider-gridscale
sonar.sources=.
sonar.tests=.
sonar.test.inclusions=**/*_test.go

# Generated code — exclude from ALL analysis (mirrors golangci `generated: lax`
# and the Autoscan-era .sonarcloud.properties exclusions). Test files are sources
# for the test sensor via sonar.test.inclusions, not main sources.
sonar.exclusions=**/zz_*.go,**/*_test.go,**/vendor/**

# Hand-written cluster/namespaced mirror — suppress copy-paste only (CPD);
# these files still participate in bug/security/reliability analysis.
sonar.cpd.exclusions=internal/controller/**/*.go,apis/**/*_types.go

# `make coverage` → cover.out (config + internal/clients hand-authored surface).
sonar.go.coverage.reportPaths=cover.out
sonar.coverage.exclusions=**/apis/**,**/cmd/**
